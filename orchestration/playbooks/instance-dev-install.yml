---
# Co-located dev instance converge — OWNED BY turbopanel/dev (the dev overlay).
#
# This is the dev-only entrypoint. It sets the shared dev-identity contract
# (turbopanel_dev_user/_uid/_gid/_root) so the daemon's *production* roles run in
# FHS + single-dev-user mode. Dev-only vars and the three dev-only roles live in
# this repo; they never mix into the daemon's production role tree. The daemon
# still executes the playbook (staged dev overlay + daemon shared roles resolved
# via ANSIBLE_ROLES_PATH — see the daemon's dev-orchestration.ts).
#
# In dev-user mode the daemon roles collapse every TurboPanel service identity
# (turbopanel/turbopaneli/turbopanelc, uid 9999/9998/9997) onto the single human
# dev user, and:
#   * source repos live under the dev user's home (turbopanel_dev_root):
#       <home>/turbopaneld, <home>/turbopanel, <home>/ui, <home>/website
#   * every mutable dir is the shared FHS location (dev-user-owned at runtime):
#       /etc/turbopanel, /var/lib/turbopanel, /var/log/turbopanel,
#       /opt/turbopanel/vendor, /run/turbopanel, /backup
#     (/backup is the managed-engine backup root — LayoutPaths.backupDir,
#      TURBOPANEL_BACKUP_DIR. It is created dev-user-owned by the shared
#      turbopanel-user role below, exactly like /var/log/turbopanel, so the
#      dev guest needs no task of its own here.)
# There is no /opt/turbopanel/platform tree and no ACL / multi-user / setgid
# reconciliation — the single dev user owns its home checkouts and the FHS trees.
#
# Run by the always-installed daemon when co-located and TURBOPANEL_DEV_INSTANCE=1.
# Every role is idempotent and never force-resets an existing dev working tree.
- name: TurboPanel co-located dev instance converge
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars:
    turbopanel_install_root: /opt/turbopanel
    # Shared dev-identity contract. turbopanel_dev_user/_uid/_gid are supplied as
    # extra-vars by the daemon's dev converge runner (run-orchestration-action.ts).
    # When non-empty, the daemon role defaults collapse every service identity onto
    # this user. Declared empty here only for documentation — the extra-vars win.
    turbopanel_dev_user: ""
    turbopanel_dev_uid: ""
    turbopanel_dev_gid: ""
    # Dev source-repo root (the dev user's home). ansible_env.HOME is unreliable
    # under become (it resolves to root's HOME), so a pre_task below overrides this
    # with the dev user's real home resolved from getent. Passed on to every
    # daemon role, which derive <root>/{turbopaneld,turbopanel,ui,website} from it.
    turbopanel_dev_root: "{{ ansible_env.HOME }}"
    instance_repo_url: https://github.com/TurboPanel/turbopanel
    ui_repo_url: https://github.com/TurboPanel/ui
    website_repo_url: https://github.com/TurboPanel/website
    github_repo_url: https://github.com/TurboPanel/.github
    instance_branch: trunk
    ui_branch: trunk
    website_branch: trunk
    github_branch: trunk
    turbopanel_ui_artifact_url: ""
    turbopanel_instance_runtime: deno
    # Caddy/UI/mailer follow instance_start; the instance unit also checks runtime.
    instance_start: true
    # Unix socket is always available; expose TCP when Workers runtime needs wrangler Hyperdrive.
    postgres_expose_port: "{{ turbopanel_instance_runtime == 'workers' }}"
    rabbitmq_amqp_port: 5672
    rabbitmq_mgmt_port: 15672
    rabbitmq_expose_mgmt_port: true
    mailpit_web_port: 8025
    mailpit_smtp_port: 1025
    redis_socket_path: /run/turbopanel/redis.sock
    redis_insight_web_port: 5540
    # Optional tooling — console picker / TURBOPANEL_OPTIONAL_* env. Core stack
    # (instance, caddy, system-stack, redis, mailer) always starts.
    # Defaults: Expo UI + website + Mailpit + Drizzle Studio on; Redis Insight
    # and the Stripe CLI forwarder off (they stay listed in the TUI, gray until
    # enabled). Stripe listen also needs a test-mode key in
    # /etc/turbopanel/stripe-listen/stripe.env, supplied by hand.
    turbopanel_optional_dbstudio: true
    turbopanel_optional_ui: true
    turbopanel_optional_website: true
    turbopanel_optional_mailpit: true
    turbopanel_optional_redis_insight: false
    turbopanel_optional_stripe_listen: false

  pre_tasks:
    - name: Refresh apt cache once per converge (Debian)
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_os_family == 'Debian'

    # Resolve the dev user's home from passwd so the daemon roles clone the source
    # repos into the real home (ansible_env.HOME is root's HOME under become).
    - name: Resolve dev user account for source-checkout root
      ansible.builtin.getent:
        database: passwd
        key: "{{ turbopanel_dev_user }}"
      when: turbopanel_dev_user | length > 0

    - name: Set dev source-repo root from the dev user's home directory
      ansible.builtin.set_fact:
        turbopanel_dev_root: "{{ getent_passwd[turbopanel_dev_user][4] }}"
      when:
        - turbopanel_dev_user | length > 0
        - getent_passwd is defined
        - getent_passwd[turbopanel_dev_user] is defined

  roles:
    - role: turbopanel-user
    - role: runtime-sockets
    - role: daemon-logs
    - role: daemon-prereqs
    - role: rapl-access
    - role: docker
    - role: postgres
    - role: redis
    - role: redis-insight
      when: turbopanel_instance_runtime == 'deno'
    - role: rabbitmq
      when: turbopanel_instance_runtime == 'deno'
    # Brings postgres/rabbitmq up as one Docker Compose project
    # (turbopanel-system); renders only whichever of those roles just ran.
    - role: system-compose
    # Host prep for shared managed-DB ingress (admin.cnf, unit, network).
    # Compose content stays daemon-owned (managed.ingress.reconcile).
    - role: proxysql
    # Host prep for per-org managed HA (api.cnf / raft.cnf, unit, network).
    # Compose content stays daemon-owned (managed.ha.reconcile).
    - role: orchestrator
    - role: mailpit
    # Stripe CLI `listen` forwarder (webhook events → /webhook/stripe).
    # Billing exists only in the Workers build; the instance unit does not
    # load stripe.env (wrangler reads .dev.vars).
    - role: stripe-listen
      when: turbopanel_instance_runtime == 'workers'
    - role: instance-user
    # GTK/NSS/GBM stack for @react-native/debugger-shell (Debian only).
    - role: instance-dev-prereqs
    - role: node-runtime
    - role: deno-runtime
    - role: dev-shell-path
    - role: caddy
    # Dev-console sudoers + dev-user ownership of the FHS trees and home checkouts,
    # before the repo roles run git/pnpm in those checkouts.
    - role: dev-host-access
    - role: dev-permissions
    - role: instance-repo
    - role: ui-repo
    - role: website-repo
    - role: github-repo
    - role: ui-build
    - role: instance-build
    # turbopanel_public_urls may be passed as an extra-var (from daemon .env via
    # devInstanceExtraArgs) to seed cert SANs before the instance .env exists.
    - role: instance-certs
    - role: instance-launch
    # Dev-only: put the hand-entered tier catalogue back after a reset/rebuild.
    - role: dev-tier-catalogue

  post_tasks:
    # If converge aborts after instance-user stops the stack (uid migration) or
    # any later failure, bring enabled units back up instead of leaving a partial stack.
    - name: Resolve core + optional unit lists
      ansible.builtin.set_fact:
        _dev_stack_units_core:
          # Covers postgres always, plus rabbitmq when the
          # system-compose role rendered it into the shared Compose project.
          - turbopanel-system-stack
          - turbopanel-instance
          - turbopanel-caddy
        _dev_stack_units_core_deno:
          - turbopanel-mailer
        _dev_optional_unit_map:
          - unit: turbopanel-dbstudio
            enabled: "{{ turbopanel_optional_dbstudio | default(false) | bool }}"
          - unit: turbopanel-ui
            enabled: "{{ turbopanel_optional_ui | default(true) | bool }}"
          - unit: turbopanel-website
            enabled: "{{ turbopanel_optional_website | default(true) | bool }}"
          - unit: turbopanel-mailpit
            enabled: "{{ turbopanel_optional_mailpit | default(true) | bool }}"
          - unit: turbopanel-redis-insight
            enabled: "{{ (turbopanel_instance_runtime == 'deno') and (turbopanel_optional_redis_insight | default(false) | bool) }}"
          - unit: turbopanel-stripe-listen
            enabled: "{{ (turbopanel_instance_runtime == 'workers') and (turbopanel_optional_stripe_listen | default(false) | bool) }}"

    - name: Resolve optional units to start
      ansible.builtin.set_fact:
        _dev_optional_start_units: "{{ _dev_optional_unit_map | selectattr('enabled') | map(attribute='unit') | list }}"
        _dev_optional_stop_units: "{{ _dev_optional_unit_map | rejectattr('enabled') | map(attribute='unit') | list }}"

    - name: Resolve dev stack unit list
      ansible.builtin.set_fact:
        _dev_stack_units: >-
          {{
            _dev_stack_units_core
            + (_dev_stack_units_core_deno if turbopanel_instance_runtime == 'deno' else [])
            + _dev_optional_start_units
          }}

    - name: Ensure core + selected optional services are running after converge
      when: instance_start | default(true) | bool
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
      loop: "{{ _dev_stack_units }}"
      failed_when: false

    - name: Stop and disable deselected optional services after converge
      when: instance_start | default(true) | bool
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: false
        state: stopped
      loop: "{{ _dev_optional_stop_units }}"
      failed_when: false

    - name: Recursively ensure vendored runtime trees are owned by the dev user
      when: turbopanel_dev_user | length > 0
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ turbopanel_dev_user }}"
        group: "{{ turbopanel_dev_user }}"
        recurse: true
      loop:
        - "{{ turbopanel_install_root }}/vendor/node"
        - "{{ turbopanel_install_root }}/vendor/deno"
        - "{{ turbopanel_install_root }}/vendor/caddy"
      failed_when: false
