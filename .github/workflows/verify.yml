name: Verify

on:
  push:
    branches:
      - trunk
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  # Typecheck + Vitest LCOV, then Sonar quality gate. If Sonar fails,
  # the workflow stops. Automatic Analysis must stay off
  # (Administration → Analysis Method).
  verify:
    runs-on: ubuntu-latest
    concurrency:
      group: dev-sonar-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          # Full history for SonarCloud new-code / blame (shallow clones skew the gate).
          fetch-depth: 0

      - name: Require SONAR_TOKEN
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN is missing — add the secret on TurboPanel/dev (or org)."
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Keep in step with NODE_VERSION in scripts/lib/paths.sh (26.7.0).
          node-version: "26.7.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check third-party notices
        run: pnpm notices:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Upload coverage LCOV
        uses: actions/upload-artifact@v7
        with:
          name: dev-coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true

  # ClickHouse/Tabix metrics infrastructure is retired (DuckDB + Parquet /
  # Analytics Engine replaced it). The guard lives in TurboPanel/turbopaneld
  # (scripts/check-metrics-legacy.ts) and scans sibling checkouts when present,
  # so check this repo out next to it — a clean single-repo turbopaneld CI run
  # cannot see PRs made here.
  metrics-legacy:
    runs-on: ubuntu-latest
    concurrency:
      group: dev-metrics-legacy-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          path: dev

      - name: Check out turbopaneld (metrics-legacy guard)
        uses: actions/checkout@v5
        with:
          repository: TurboPanel/turbopaneld
          path: turbopaneld

      - name: Install Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          # Keep in step with DENO_VERSION / deno_version / TP_DENO_VERSION (2.9.6).
          deno-version: "2.9.6"

      - name: Check metrics legacy (no ClickHouse/Tabix references)
        working-directory: turbopaneld
        run: deno task check:metrics-legacy
